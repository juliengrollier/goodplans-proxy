<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Good Plans · Category mapper</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
  :root { --bg:#FBF7EF; --card:#fff; --ink:#1B1F3B; --ink2:#3A3E58; --ink3:#6A6E88; --line:#E7E1D4; --chip:#F1ECE1; --navy:#1B1F3B; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Nunito Sans",system-ui,sans-serif; font-size:15px; }
  h1,h2,h3,.disp { font-family:"Fredoka",system-ui,sans-serif; font-weight:600; margin:0; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .wrap { max-width:760px; margin:0 auto; padding:16px 14px 120px; }
  .top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .top h1 { font-size:26px; flex:1; min-width:200px; }
  .pill { border:none; border-radius:999px; height:40px; padding:0 16px; font-weight:800; background:var(--chip); }
  .pill.dark { background:var(--navy); color:#fff; }
  .tabs { display:flex; gap:6px; margin:14px 0 6px; position:sticky; top:0; background:var(--bg); padding:8px 0; z-index:5; }
  .tab { border:1px solid var(--line); background:var(--card); border-radius:999px; height:36px; padding:0 14px; font-weight:800; font-size:14px; }
  .tab[aria-selected="true"] { background:var(--navy); color:#fff; border-color:var(--navy); }
  .muted { color:var(--ink3); }

  .dot { width:14px; height:14px; border-radius:7px; flex-shrink:0; }
  .famhead h2 { font-size:20px; flex:1; }
  .cat { cursor:default; background:var(--card); border-radius:18px; padding:12px 14px; margin-bottom:8px; border-left:6px solid; display:flex; flex-direction:column; gap:6px; width:100%; text-align:left; border-top:none; border-right:none; border-bottom:none; box-shadow:0 1px 0 var(--line); }
  .cat .row1 { display:flex; align-items:baseline; gap:8px; }

  .cat .rank { font-size:12px; font-weight:800; color:var(--ink3); }

  .chip.sub { background:transparent; border:1px solid var(--line); }
  .chip .x { border:none; background:none; padding:0 0 0 2px; font-weight:800; color:var(--ink3); }
  .kw { font-family:ui-monospace,Menlo,monospace; font-size:12px; font-weight:600; }
  .add { border:1.5px dashed var(--line); background:none; border-radius:14px; height:40px; width:100%; font-weight:800; color:var(--ink3); }
  .card { background:var(--card); border-radius:20px; padding:16px; margin-top:14px; display:flex; flex-direction:column; gap:10px; }
  input[type=text], textarea, select { font:inherit; border:1.5px solid var(--line); border-radius:12px; padding:9px 11px; width:100%; background:#fff; color:var(--ink); }
  textarea { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  label.f { font-size:12.5px; font-weight:800; color:var(--ink3); display:block; margin-bottom:4px; }
  .rowx { display:flex; gap:8px; align-items:center; }
  .sheetbg { position:fixed; inset:0; background:rgba(27,31,59,.35); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:var(--bg); width:100%; max-width:760px; max-height:92vh; overflow:auto; border-radius:26px 26px 0 0; padding:18px 16px 28px; display:flex; flex-direction:column; gap:14px; }
  .sheet .hd { display:flex; align-items:center; gap:10px; }
  .sheet .hd h3 { flex:1; font-size:21px; }
  .round { width:40px; height:40px; border-radius:20px; border:none; background:var(--chip); font-size:18px; font-weight:800; flex-shrink:0; }
  .famchips { display:flex; flex-wrap:wrap; gap:6px; }
  .famchip { border:2px solid transparent; border-radius:999px; padding:6px 12px; font-weight:800; font-size:13px; color:#fff; }
  .famchip[aria-pressed="true"] { outline:3px solid var(--ink); outline-offset:1px; }
  .subrow { display:flex; align-items:center; gap:8px; background:var(--card); border-radius:14px; padding:10px 12px; }
  .subrow .n { flex:1; font-weight:800; }
  .danger { color:#B42318; }
  .result { background:var(--card); border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:6px; }
  .big { font-family:"Fredoka",system-ui,sans-serif; font-size:22px; font-weight:600; }
  .log li { margin-bottom:6px; line-height:1.4; }
  .handle { cursor:grab; color:var(--ink3); font-size:18px; line-height:1; padding:2px 4px; touch-action:none; user-select:none; }
  .edit { border:none; background:var(--chip); border-radius:999px; height:30px; padding:0 12px; font-weight:800; font-size:12.5px; }
  .drop { min-height:30px; border-radius:12px; }
  .chips.drop { padding:4px; margin:-4px; }
  .sortable-ghost { opacity:.35; }
  .sortable-chosen { box-shadow:0 6px 18px rgba(27,31,59,.25); }
  .toggle { border:none; background:none; padding:0; font-weight:800; font-size:12.5px; color:var(--ink3); text-align:left; }
  .chip[data-term], .chip[data-sub] { cursor:grab; user-select:none; -webkit-user-select:none; }
  .famsort { display:flex; flex-wrap:wrap; gap:6px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--navy); color:#fff; padding:10px 16px; border-radius:14px; font-weight:800; z-index:30; display:none; }
  .confirm { display:none; gap:8px; align-items:center; }
  .confirm.on { display:flex; }
</style>

<script>
const SEED = JSON.parse(document.getElementById("seed").textContent);
const KEY = "gp_catmapper_v2";
let S, log, tab = "map", open = null; // open = {type:"cat", id} | {type:"sub", cat, name}
const load = () => { try { const j = JSON.parse(localStorage.getItem(KEY) || "null"); if (j && j.data) { S = j.data; log = j.log || [];
      // Keep earlier edits, but apply the app's own changes since: Jazz and Blues became separate sub-types
      S.categories.forEach((c) => { const i = c.subs.findIndex((x) => x.name === "Jazz & Blues"); if (i >= 0) c.subs.splice(i, 1, { name: "Jazz", terms: ["jazz", "bebop", "big band", "swing"] }, { name: "Blues", terms: ["blues"] }); });
      return; } } catch (e) {} S = structuredClone(SEED); log = []; };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ data: S, log })); } catch (e) {} };
const note = (t) => { log.push(t); save(); };
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fam = (id) => S.families.find((f) => f.id === id) || { label: id, color: "#8A8F98" };
const cat = (id) => S.categories.find((c) => c.id === id);
const toast = (t) => { const el = $("#toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => (el.style.display = "none"), 1800); };
const re = (terms) => { try { return terms.length ? new RegExp(terms.join("|"), "i") : null; } catch (e) { return null; } };
const firstHit = (terms, text) => { for (const t of terms) { try { const m = new RegExp(t, "i").exec(text); if (m) return { term: t, match: m[0] }; } catch (e) {} } return null; };

// Same order as the app: title-only early rules, then each category on the title, then on title + description
function classify(title, desc) {
  const t = title.toLowerCase(), full = (title + " " + desc).toLowerCase();
  for (const e of S.early) { const h = firstHit(e.terms, t); if (h && cat(e.cat)) return { cat: e.cat, stage: "early rule on the title", ...h }; }
  for (const c of S.categories) { const h = firstHit(c.terms, t); if (h) return { cat: c.id, stage: "title", ...h }; }
  for (const c of S.categories) { const h = firstHit(c.terms, full); if (h) return { cat: c.id, stage: "title + description", ...h }; }
  return null;
}
function classifySub(c, title, desc) {
  const t = title.toLowerCase(), full = (title + " " + desc).toLowerCase();
  for (const s of c.subs) { const h = firstHit(s.terms, t); if (h) return { sub: s.name, ...h }; }
  for (const s of c.subs) { const h = firstHit(s.terms, full); if (h) return { sub: s.name, ...h }; }
  return null;
}

function render() {
  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  $("#nChanges").textContent = log.length ? "(" + log.length + ")" : "";
  const v = $("#view");
  if (tab === "map") v.innerHTML = mapView();
  if (tab === "test") v.innerHTML = testView();
  if (tab === "changes") v.innerHTML = changesView();
  renderSheet();
  initDrag();
}

const expanded = new Set();
function termChips(terms, attrs) {
  return terms.map((t) => `<span class="chip" data-term="${esc(t)}"><span class="kw">${esc(t)}</span></span>`).join("");
}
function mapView() {
  let h = `<div class="card"><div class="disp" style="font-size:18px">Checked first, on titles only</div>
    <div class="muted" style="font-size:13px">Strong title words that win before anything else. Drag words in or out of these.</div>`;
  S.early.forEach((e, i) => {
    h += `<div><label class="f">${esc(e.cat)}</label><div class="chips drop" data-list="terms" data-early="${i}">${termChips(e.terms)}</div>
      <button class="chip" style="margin-top:6px" data-act="early-add" data-i="${i}">+ word</button></div>`;
  });
  h += `</div>`;
  h += `<div class="card"><div class="disp" style="font-size:18px">Family order</div><div class="muted" style="font-size:13px">Drag to reorder the colour families in the app's filter bar.</div>
    <div class="famsort drop" data-list="fams">${S.families.map((f) => `<span class="famchip" data-fam="${f.id}" style="background:${f.color};cursor:grab">${esc(f.label)}</span>`).join("")}</div></div>`;
  h += `<p class="muted" style="font-size:13px;margin:14px 2px 0">Drag a category by ⠿ to reorder it or move it to another family. Drag sub-types and words (hold, then move) between categories. ✎ edits names, merges and deletes.</p>`;
  const order = S.categories.map((c) => c.id);
  S.families.forEach((f) => {
    const cats = S.categories.filter((c) => c.fam === f.id);
    h += `<div class="fam"><div class="famhead"><span class="dot" style="background:${f.color}"></span><h2>${esc(f.label)}</h2><span class="muted" style="font-weight:800;font-size:13px">${cats.length}</span></div>
      <div class="drop" data-list="cats" data-fam="${f.id}">`;
    cats.forEach((c) => {
      const ex = expanded.has(c.id);
      h += `<div class="cat" data-cat="${esc(c.id)}" style="border-left-color:${f.color}">
        <span class="row1"><span class="handle" aria-label="Drag ${esc(c.id)}">⠿</span><span class="name">${esc(c.id)}</span><span class="rank">#${order.indexOf(c.id) + 1}</span><button class="edit" data-act="open-cat" data-id="${esc(c.id)}">✎ Edit</button></span>
        <span class="muted" style="font-size:11.5px;font-weight:800">SUB-TYPES</span>
        <span class="chips drop" data-list="subs" data-cat="${esc(c.id)}">${c.subs.map((s) => `<span class="chip sub" data-sub="${esc(s.name)}">${esc(s.name)}</span>`).join("")}</span>
        <button class="toggle" data-act="toggle-terms" data-id="${esc(c.id)}">${ex ? "▾" : "▸"} ${c.terms.length} words${ex ? "" : ": <span class='kw'>" + esc(c.terms.slice(0, 5).join(", ")) + (c.terms.length > 5 ? "…" : "") + "</span>"}</button>
        ${ex ? `<span class="chips drop" data-list="terms" data-cat="${esc(c.id)}">${termChips(c.terms)}</span>` : ""}
      </div>`;
    });
    h += `</div><button class="add" data-act="add-cat" data-fam="${f.id}">+ Category in ${esc(f.label)}</button></div>`;
  });
  return h;
}

// Drag and drop at every level (touch friendly: hold briefly, then drag)
let sortables = [];
function initDrag() {
  sortables.forEach((x) => x.destroy()); sortables = [];
  if (!window.Sortable || tab !== "map") return;
  const base = { animation: 150, delay: 180, delayOnTouchOnly: true, forceFallback: true, fallbackTolerance: 4, scroll: true, bubbleScroll: true, ghostClass: "sortable-ghost", chosenClass: "sortable-chosen" };
  const after = () => setTimeout(() => { save(); render(); }, 0);
  const fl = document.querySelector('[data-list="fams"]');
  if (fl) sortables.push(Sortable.create(fl, { ...base, onEnd: () => {
    const ids = [...fl.children].map((n) => n.dataset.fam), before = S.families.map((f) => f.id).join();
    S.families = ids.map((id) => S.families.find((f) => f.id === id));
    if (before !== ids.join()) note("Family order: " + S.families.map((f) => f.label).join(", "));
    after();
  } }));
  document.querySelectorAll('[data-list="cats"]').forEach((el) => sortables.push(Sortable.create(el, { ...base, group: "cats", handle: ".handle", delay: 0, onEnd: (ev) => {
    const id = ev.item.dataset.cat, c = cat(id), toFam = ev.to.dataset.fam, fromFam = ev.from.dataset.fam;
    if (toFam !== fromFam) { c.fam = toFam; note(`Moved "${id}" from ${fam(fromFam).label} to ${fam(toFam).label}`); }
    // Reorder within the destination family, keeping the priority slots that family holds overall
    const ids = [...ev.to.children].map((n) => n.dataset.cat).filter(Boolean);
    const slots = S.categories.map((x, i) => (ids.includes(x.id) ? i : -1)).filter((i) => i >= 0);
    const oldRank = S.categories.indexOf(c);
    const items = ids.map((x) => cat(x)); slots.forEach((slot, k) => { S.categories[slot] = items[k]; });
    const newRank = S.categories.indexOf(c);
    if (newRank !== oldRank) note(`Priority: "${id}" now checked #${newRank + 1} (was #${oldRank + 1})`);
    after();
  } })));
  document.querySelectorAll('[data-list="subs"]').forEach((el) => sortables.push(Sortable.create(el, { ...base, group: "subs", onEnd: (ev) => {
    const name = ev.item.dataset.sub, from = cat(ev.from.dataset.cat), to = cat(ev.to.dataset.cat);
    const sub = from.subs.find((x) => x.name === name); if (!sub) return after();
    if (from !== to) { if (to.subs.some((x) => x.name === name)) { toast(to.id + " already has " + name); return after(); }
      from.subs.splice(from.subs.indexOf(sub), 1); note(`Moved sub-type "${name}" from "${from.id}" to "${to.id}"`); }
    const names = [...ev.to.children].map((n) => n.dataset.sub);
    const all = from === to ? to.subs : [...to.subs, sub];
    const before = to.subs.map((x) => x.name).join();
    to.subs = names.map((n) => all.find((x) => x.name === n)).filter(Boolean);
    if (from === to && before !== names.join()) note(`Sub-type order in "${to.id}": ${names.join(", ")} (first match wins)`);
    after();
  } })));
  const termList = (el) => (el.dataset.early != null ? S.early[+el.dataset.early] : cat(el.dataset.cat));
  const termName = (el) => (el.dataset.early != null ? "early rule for \"" + S.early[+el.dataset.early].cat + "\"" : "\"" + el.dataset.cat + "\"");
  document.querySelectorAll('[data-list="terms"]').forEach((el) => sortables.push(Sortable.create(el, { ...base, group: "terms", onEnd: (ev) => {
    const t = ev.item.dataset.term, from = termList(ev.from), to = termList(ev.to);
    if (from !== to) {
      from.terms = from.terms.filter((x) => x !== t);
      if (!to.terms.includes(t)) to.terms.push(t);
      note(`Word "${t}" moved from ${termName(ev.from)} to ${termName(ev.to)}`);
    }
    const ordered = [...ev.to.children].map((n) => n.dataset.term).filter((x) => to.terms.includes(x));
    to.terms = [...new Set([...ordered, ...to.terms])];
    after();
  } })));
}

function testView() {
  const t = window._tt || "", d = window._td || "";
  let res = "";
  if (t.trim()) {
    const r = classify(t, d);
    if (!r) res = `<div class="result"><div class="big">No rule matches</div><div class="muted">The app would fall back on the source's own category, or Claude's pick.</div></div>`;
    else {
      const c = cat(r.cat), s = c ? classifySub(c, t, d) : null;
      res = `<div class="result"><div class="muted" style="font-weight:800;font-size:12.5px">${esc(fam(c.fam).label)}</div>
        <div class="big"><span class="dot" style="display:inline-block;background:${fam(c.fam).color};margin-right:8px"></span>${esc(r.cat)}${s ? " · " + esc(s.sub) : ""}</div>
        <div class="muted" style="font-size:13.5px">Matched <span class="kw">${esc(r.match)}</span> (word <span class="kw">${esc(r.term)}</span>) in the ${esc(r.stage)}.${s ? ` Sub-type from <span class="kw">${esc(s.match)}</span>.` : c && c.subs.length ? " No sub-type matched." : ""}</div>
        <div class="muted" style="font-size:12.5px">In the app, Claude's own pick comes right after the early rules, so live results can differ.</div></div>`;
    }
  }
  return `<div class="card"><div><label class="f" for="tt">Event title</label><input type="text" id="tt" value="${esc(t)}" placeholder="Open mic at Pete's Candy Store"></div>
    <div><label class="f" for="td">Description (optional)</label><input type="text" id="td" value="${esc(d)}" placeholder="Folk and acoustic sets, sign-up at 7"></div></div><div style="margin-top:14px" id="res">${res}</div>`;
}

function changesView() {
  const out = exportText();
  return `<div class="card"><div class="disp" style="font-size:18px">${log.length ? log.length + " change" + (log.length > 1 ? "s" : "") : "No changes yet"}</div>
    ${log.length ? `<ol class="log">${log.map((l) => `<li>${esc(l)}</li>`).join("")}</ol>` : `<div class="muted">Changes you make in Map show up here.</div>`}</div>
    <div class="card"><label class="f">What Copy for Claude sends</label><textarea rows="10" readonly>${esc(out)}</textarea></div>`;
}

function exportText() {
  const compact = { families: S.families.map((f) => ({ id: f.id, label: f.label })), early: S.early, categories: S.categories.map((c) => ({ id: c.id, fam: c.fam, terms: c.terms, subs: c.subs })) };
  return "Good Plans category mapping: please apply these changes.\n\nChanges:\n" + (log.length ? log.map((l, i) => i + 1 + ". " + l).join("\n") : "(none)") + "\n\nFull mapping (order = priority):\n" + JSON.stringify(compact);
}

function renderSheet() {
  document.querySelectorAll(".sheetbg").forEach((n) => n.remove());
  if (!open) return;
  const bg = document.createElement("div"); bg.className = "sheetbg";
  bg.addEventListener("click", (e) => { if (e.target === bg) { open = null; render(); } });
  const sh = document.createElement("div"); sh.className = "sheet"; sh.setAttribute("role", "dialog");
  if (open.type === "cat") {
    const c = cat(open.id); if (!c) { open = null; return; }
    const idx = S.categories.indexOf(c);
    sh.innerHTML = `<div class="hd"><h3>${esc(c.id)}</h3><button class="round" data-act="close" aria-label="Close">×</button></div>
      <div><label class="f" for="cname">Name</label><div class="rowx"><input type="text" id="cname" value="${esc(c.id)}"><button class="pill" data-act="rename-cat">Rename</button></div></div>
      <div><label class="f">Colour family</label><div class="famchips">${S.families.map((f) => `<button class="famchip" style="background:${f.color}" aria-pressed="${f.id === c.fam}" data-act="move-cat" data-fam="${f.id}">${esc(f.label)}</button>`).join("")}</div></div>
      <div><label class="f">Priority: checked #${idx + 1} of ${S.categories.length} (first match wins)</label><div class="rowx">
        <button class="pill" data-act="up" ${idx === 0 ? "disabled" : ""}>↑ Earlier</button><button class="pill" data-act="down" ${idx === S.categories.length - 1 ? "disabled" : ""}>↓ Later</button></div></div>
      <div><label class="f">Words it listens for</label><div class="chips">${c.terms.map((t, j) => `<span class="chip"><span class="kw">${esc(t)}</span><button class="x" aria-label="Remove ${esc(t)}" data-act="term-del" data-j="${j}">×</button></span>`).join("")}</div>
        <div class="rowx" style="margin-top:8px"><input type="text" id="newterm" placeholder="add a word, e.g. open mic"><button class="pill" data-act="term-add">Add</button></div></div>
      <div><label class="f">Sub-types</label><div style="display:flex;flex-direction:column;gap:6px">${c.subs.map((s) => `<button class="subrow" data-act="open-sub" data-name="${esc(s.name)}" style="border:none;text-align:left"><span class="n">${esc(s.name)}</span><span class="muted" style="font-size:12.5px">${s.terms.length} words ›</span></button>`).join("") || `<span class="muted">None</span>`}</div>
        <div class="rowx" style="margin-top:8px"><input type="text" id="newsub" placeholder="new sub-type name"><button class="pill" data-act="sub-add">Add</button></div></div>
      <div><label class="f">Merge into another category</label><div class="rowx"><select id="mergeTo">${S.categories.filter((x) => x !== c).map((x) => `<option>${esc(x.id)}</option>`).join("")}</select><button class="pill" data-act="merge">Merge</button></div></div>
      <div class="rowx"><button class="pill danger" data-act="del-cat-ask">Delete category</button><span class="confirm" id="delc"><span class="muted">Sure?</span><button class="pill danger" data-act="del-cat">Delete</button></span></div>`;
  } else {
    const c = cat(open.cat), s = c && c.subs.find((x) => x.name === open.name); if (!s) { open = null; return; }
    sh.innerHTML = `<div class="hd"><button class="round" data-act="back-cat" aria-label="Back">‹</button><h3>${esc(s.name)}</h3><button class="round" data-act="close" aria-label="Close">×</button></div>
      <div class="muted" style="font-size:13px">Sub-type of ${esc(c.id)}</div>
      <div><label class="f" for="sname">Name</label><div class="rowx"><input type="text" id="sname" value="${esc(s.name)}"><button class="pill" data-act="rename-sub">Rename</button></div></div>
      <div><label class="f">Move to category</label><div class="rowx"><select id="subTo">${S.categories.filter((x) => x !== c).map((x) => `<option>${esc(x.id)}</option>`).join("")}</select><button class="pill" data-act="move-sub">Move</button></div></div>
      <div><label class="f">Words it listens for</label><div class="chips">${s.terms.map((t, j) => `<span class="chip"><span class="kw">${esc(t)}</span><button class="x" aria-label="Remove ${esc(t)}" data-act="sterm-del" data-j="${j}">×</button></span>`).join("")}</div>
        <div class="rowx" style="margin-top:8px"><input type="text" id="newsterm" placeholder="add a word"><button class="pill" data-act="sterm-add">Add</button></div></div>
      <div class="rowx"><button class="pill danger" data-act="del-sub">Delete sub-type</button></div>`;
  }
  bg.appendChild(sh); document.body.appendChild(bg);
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act],[data-tab]"); if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; open = null; render(); return; }
  const a = b.dataset.act;
  const c = open && open.type === "cat" ? cat(open.id) : open && open.type === "sub" ? cat(open.cat) : null;
  const s = open && open.type === "sub" && c ? c.subs.find((x) => x.name === open.name) : null;
  const val = (id) => ($("#" + id)?.value || "").trim();
  switch (a) {
    case "close": open = null; break;
    case "toggle-terms": { const id = b.dataset.id; if (expanded.has(id)) expanded.delete(id); else expanded.add(id); render(); return; }
    case "open-cat": open = { type: "cat", id: b.dataset.id }; break;
    case "open-sub": open = { type: "sub", cat: c.id, name: b.dataset.name }; break;
    case "back-cat": open = { type: "cat", id: c.id }; break;
    case "add-cat": {
      let n = "New category", i = 2; while (cat(n)) n = "New category " + i++;
      S.categories.push({ id: n, fam: b.dataset.fam, terms: [], subs: [] }); note(`Added category "${n}" in ${fam(b.dataset.fam).label}`); open = { type: "cat", id: n }; break;
    }
    case "rename-cat": { const n = val("cname"); if (!n || n === c.id) break; if (cat(n)) { toast("That name exists"); return; }
      note(`Renamed category "${c.id}" to "${n}"`); S.early.forEach((x) => { if (x.cat === c.id) x.cat = n; }); if (expanded.has(c.id)) { expanded.delete(c.id); expanded.add(n); } c.id = n; open.id = n; break; }
    case "move-cat": if (b.dataset.fam !== c.fam) { note(`Moved "${c.id}" from ${fam(c.fam).label} to ${fam(b.dataset.fam).label}`); c.fam = b.dataset.fam; } break;
    case "up": case "down": { const i = S.categories.indexOf(c), j = a === "up" ? i - 1 : i + 1; if (j < 0 || j >= S.categories.length) break;
      [S.categories[i], S.categories[j]] = [S.categories[j], S.categories[i]]; note(`Priority: "${c.id}" now checked ${a === "up" ? "before" : "after"} "${S.categories[i].id}" (#${j + 1})`); break; }
    case "term-del": { const t = c.terms[+b.dataset.j]; c.terms.splice(+b.dataset.j, 1); note(`"${c.id}" no longer listens for "${t}"`); break; }
    case "term-add": { const t = val("newterm").toLowerCase(); if (!t || c.terms.includes(t)) break; c.terms.push(t); note(`"${c.id}" now listens for "${t}"`); break; }
    case "sub-add": { const n = val("newsub"); if (!n || c.subs.some((x) => x.name === n)) break; c.subs.push({ name: n, terms: [] }); note(`Added sub-type "${n}" to "${c.id}"`); open = { type: "sub", cat: c.id, name: n }; break; }
    case "merge": { const to = cat(val("mergeTo")); if (!to) break;
      to.terms = [...new Set([...to.terms, ...c.terms])]; c.subs.forEach((x) => { if (!to.subs.some((y) => y.name === x.name)) to.subs.push(x); });
      S.early.forEach((x) => { if (x.cat === c.id) x.cat = to.id; });
      S.categories.splice(S.categories.indexOf(c), 1); note(`Merged "${c.id}" into "${to.id}" (its words and sub-types moved over)`); open = { type: "cat", id: to.id }; break; }
    case "del-cat-ask": $("#delc").classList.add("on"); return;
    case "del-cat": S.categories.splice(S.categories.indexOf(c), 1); S.early = S.early.filter((x) => x.cat !== c.id); note(`Deleted category "${c.id}"`); open = null; break;
    case "rename-sub": { const n = val("sname"); if (!n || n === s.name || c.subs.some((x) => x.name === n)) break; note(`Renamed sub-type "${c.id} › ${s.name}" to "${n}"`); s.name = n; open.name = n; break; }
    case "move-sub": { const to = cat(val("subTo")); if (!to) break; c.subs.splice(c.subs.indexOf(s), 1); to.subs.push(s); note(`Moved sub-type "${s.name}" from "${c.id}" to "${to.id}"`); open = { type: "sub", cat: to.id, name: s.name }; break; }
    case "sterm-del": { const t = s.terms[+b.dataset.j]; s.terms.splice(+b.dataset.j, 1); note(`"${c.id} › ${s.name}" no longer listens for "${t}"`); break; }
    case "sterm-add": { const t = val("newsterm").toLowerCase(); if (!t || s.terms.includes(t)) break; s.terms.push(t); note(`"${c.id} › ${s.name}" now listens for "${t}"`); break; }
    case "del-sub": c.subs.splice(c.subs.indexOf(s), 1); note(`Deleted sub-type "${c.id} › ${s.name}"`); open = { type: "cat", id: c.id }; break;
    case "early-del": { const r = S.early[+b.dataset.i], t = r.terms[+b.dataset.j]; r.terms.splice(+b.dataset.j, 1); note(`Early rule for "${r.cat}" no longer catches "${t}"`); break; }
    case "early-add": { const r = S.early[+b.dataset.i]; const inp = document.createElement("input"); inp.type = "text"; inp.placeholder = "word, then Enter"; inp.style.cssText = "width:160px;padding:4px 10px;border-radius:999px";
      b.replaceWith(inp); inp.focus(); inp.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { const t = inp.value.trim().toLowerCase(); if (t && !r.terms.includes(t)) { r.terms.push(t); note(`Early rule for "${r.cat}" now catches "${t}"`); } render(); } });
      inp.addEventListener("blur", () => setTimeout(render, 150)); return; }
    default: return;
  }
  save(); render();
});
document.addEventListener("input", (e) => {
  if (e.target.id === "tt" || e.target.id === "td") { window._tt = $("#tt").value; window._td = $("#td").value;
    const v = $("#view"), keep = e.target.id, pos = e.target.selectionStart; v.innerHTML = testView(); const el = $("#" + keep); el.focus(); try { el.setSelectionRange(pos, pos); } catch (er) {} }
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const map = { newterm: "term-add", newsub: "sub-add", newsterm: "sterm-add", cname: "rename-cat", sname: "rename-sub" };
  const act = map[e.target.id]; if (act) document.querySelector(`[data-act="${act}"]`)?.click();
});
$("#copyBtn").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(exportText()); toast("Copied. Paste it into the chat"); }
  catch (e) { tab = "changes"; render(); toast("Copy blocked: select the text below and copy it"); }
});
$("#resetBtn").addEventListener("click", () => $("#resetConfirm").classList.add("on"));
$("#resetNo").addEventListener("click", () => $("#resetConfirm").classList.remove("on"));
$("#resetYes").addEventListener("click", () => { S = structuredClone(SEED); log = []; save(); $("#resetConfirm").classList.remove("on"); open = null; render(); toast("Back to the app's current mapping"); });
load(); render();
</script>
